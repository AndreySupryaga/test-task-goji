<section class="grocery-list" aria-label="Grocery list">
  <div class="grocery-list__header">
    <h1 class="grocery-list__title">{{ 'grocery.title' | transloco }}</h1>
    <button
      mat-flat-button
      color="primary"
      [disabled]="loading()"
      (click)="onOpenAddForm()"
    >
      <mat-icon>add</mat-icon>
      {{ 'grocery.addItem' | transloco }}
    </button>
  </div>

  <form novalidate>
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>{{ 'form.name' | transloco }}</mat-label>
      <input matInput [formField]="form.search" autocomplete="off" />
    </mat-form-field>
  </form>

  @if (loading()) {
    <app-loader />
  } @else if (error()) {
    <div class="grocery-list__error" role="alert">
      <p>{{ error() }}</p>
      <button mat-stroked-button (click)="onRetryLoad()">
        <mat-icon>refresh</mat-icon>
        {{ 'errors.retry' | transloco }}
      </button>
    </div>
  } @else {
    <mat-tab-group
      [selectedIndex]="activeTab() === 'pending' ? 0 : 1"
      (selectedIndexChange)="onTabChange($event)"
    >
      <mat-tab [label]="'grocery.tabs.pending' | transloco">
        @if (items().length === 0) {
          <div class="grocery-list__tab-content">
            <app-empty-state
              [title]="'grocery.empty.title' | transloco"
              [description]="'grocery.empty.description' | transloco"
              icon="🛒"
            />
          </div>
        } @else {
          <div class="grocery-list__tab-content">
            @for (item of items(); track item.id) {
              <app-grocery-item
                animate.enter="slide-down"
                [item]="item"
                (toggleBought)="onToggleBought($event)"
                (edit)="onOpenEditForm($event)"
                (delete)="onDeleteItem($event)"
              />
            }
          </div>
        }
      </mat-tab>

      <mat-tab [label]="'grocery.tabs.bought' | transloco">
        @if (items().length === 0) {
          <div class="grocery-list__tab-content">
            <app-empty-state
              [title]="'grocery.empty.title' | transloco"
              [description]="'grocery.empty.description' | transloco"
              icon="✅"
            />
          </div>
        } @else {
          <div class="grocery-list__tab-content grocery-list__section--bought">
            @for (item of items(); track item.id) {
              <app-grocery-item
                animate.enter="slide-down"
                [item]="item"
                (toggleBought)="onToggleBought($event)"
                (edit)="onOpenEditForm($event)"
                (delete)="onDeleteItem($event)"
              />
            }
          </div>
        }
      </mat-tab>
    </mat-tab-group>
  }
</section>
